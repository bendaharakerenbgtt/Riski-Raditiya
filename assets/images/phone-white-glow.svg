<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%" aria-hidden="true">
  <defs>
    <linearGradient id="phoneBodyGradRef" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242c3d" />
      <stop offset="50%" stop-color="#141924" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>
    <linearGradient id="phoneSheenRef" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="phoneAuraRef" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Orbital Pedestal -->
  <circle cx="160" cy="160" r="140" fill="url(#phoneAuraRef)" />
  <circle cx="160" cy="160" r="125" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="5 7" />
  <circle cx="160" cy="160" r="105" fill="#0d111a" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Telephone Receiver Handset -->
  <g transform="translate(10, 10)">
    <!-- Shadow -->
    <path d="M 95 65 C 105 45, 130 45, 145 60 L 165 80 C 178 93, 178 115, 165 128 L 150 143 C 145 148, 145 155, 150 165 C 165 195, 195 225, 225 240 C 235 245, 242 245, 247 240 L 262 225 C 275 212, 297 212, 310 225 L 330 245 C 345 260, 345 285, 325 295 C 285 315, 230 305, 175 270 C 120 235, 75 185, 55 135 C 45 110, 65 75, 95 65 Z" 
          fill="#000000" opacity="0.5" transform="scale(0.72) translate(33, 26)" />

    <!-- Sculpted Chassis -->
    <path d="M 95 65 C 105 45, 130 45, 145 60 L 165 80 C 178 93, 178 115, 165 128 L 150 143 C 145 148, 145 155, 150 165 C 165 195, 195 225, 225 240 C 235 245, 242 245, 247 240 L 262 225 C 275 212, 297 212, 310 225 L 330 245 C 345 260, 345 285, 325 295 C 285 315, 230 305, 175 270 C 120 235, 75 185, 55 135 C 45 110, 65 75, 95 65 Z" 
          fill="url(#phoneBodyGradRef)" 
          stroke="#ffffff" 
          stroke-width="2.5" 
          transform="scale(0.72) translate(30, 20)" />

    <!-- Specular Highlight Line -->
    <path d="M 68 135 C 85 180, 126 226, 172 258 C 218 290, 268 300, 305 285" fill="none" stroke="url(#phoneSheenRef)" stroke-width="2.5" stroke-linecap="round" transform="scale(0.72) translate(30, 20)" />

    <!-- Speaker Ports -->
    <g fill="#000000" opacity="0.6" transform="scale(0.72) translate(30, 20)">
      <circle cx="125" cy="72" r="3.5" />
      <circle cx="137" cy="80" r="3.5" />
      <circle cx="147" cy="90" r="3.5" />
      <circle cx="300" cy="255" r="3.5" />
      <circle cx="310" cy="265" r="3.5" />
      <circle cx="320" cy="275" r="3.5" />
    </g>

    <!-- Signal Wave Arcs -->
    <g stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.85">
      <path d="M 195 95 C 218 112, 228 132, 228 156" />
      <path d="M 215 78 C 248 102, 260 134, 260 174" />
      <path d="M 235 62 C 278 92, 292 136, 292 192" />
    </g>
  </g>
</svg>
