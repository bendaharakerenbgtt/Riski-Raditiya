<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none" aria-hidden="true">
  <defs>
    <style>
      .line-main { stroke: var(--accent, #9D84B7); stroke-width: 1.25; opacity: 0.7; }
      .line-subtle { stroke: var(--border-subtle, #3A3844); stroke-width: 1; stroke-dasharray: 4 6; opacity: 0.8; }
      .point-accent { fill: var(--accent, #9D84B7); }
      .point-soft { fill: var(--text-muted, #74707D); opacity: 0.5; }
    </style>
  </defs>

  <!-- Horizon Line -->
  <line x1="40" y1="180" x2="560" y2="180" class="line-subtle"/>

  <!-- Delicate Minimalist Orbitals / Silhouettes of Thought -->
  <ellipse cx="300" cy="180" rx="180" ry="85" class="line-subtle"/>
  <ellipse cx="300" cy="180" rx="240" ry="115" stroke="var(--border-subtle, #3A3844)" stroke-width="0.75" opacity="0.4"/>
  <ellipse cx="300" cy="180" rx="110" ry="50" class="line-main"/>

  <!-- Vertical Axis of Inquiry -->
  <line x1="300" y1="40" x2="300" y2="320" class="line-subtle"/>

  <!-- Focal Nodes (Points of curiosity and connection) -->
  <circle cx="300" cy="180" r="3" class="point-accent"/>
  <circle cx="190" cy="180" r="2.5" class="point-accent"/>
  <circle cx="410" cy="180" r="2.5" class="point-accent"/>
  
  <circle cx="300" cy="95" r="2" class="point-soft"/>
  <circle cx="300" cy="265" r="2" class="point-soft"/>

  <!-- Subtle Coordinates -->
  <text x="50" y="172" font-family="monospace" font-size="9" fill="var(--text-muted, #74707D)" letter-spacing="0.1em">0.0 // ORIGIN</text>
  <text x="475" y="172" font-family="monospace" font-size="9" fill="var(--text-muted, #74707D)" letter-spacing="0.1em">CONTINUUM</text>
</svg>
