<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .bg { fill: var(--card-canvas-bg, #27262D); }
      .stroke-subtle { stroke: var(--border-subtle, #3A3844); stroke-width: 1.5; }
      .stroke-muted { stroke: var(--text-muted, #77727E); stroke-width: 1.5; }
      .stroke-accent { stroke: var(--accent, #9D84B7); stroke-width: 2; }
      .text-title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--text-primary, #F0EFEB); letter-spacing: 0.08em; }
      .text-body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 11px; fill: var(--text-secondary, #9E9AA7); }
      .text-code { font-family: monospace; font-size: 10px; fill: var(--accent, #9D84B7); }
    </style>
  </defs>
  
  <!-- Canvas Background -->
  <rect width="800" height="500" rx="8" class="bg"/>
  
  <!-- Subtle Grid lines -->
  <line x1="80" y1="60" x2="720" y2="60" class="stroke-subtle" stroke-dasharray="2 4"/>
  <line x1="80" y1="440" x2="720" y2="440" class="stroke-subtle" stroke-dasharray="2 4"/>
  <line x1="400" y1="60" x2="400" y2="440" class="stroke-subtle" stroke-dasharray="2 4"/>

  <!-- Left Pane: Input & Source Reading -->
  <rect x="110" y="90" width="260" height="320" rx="4" class="stroke-subtle"/>
  <text x="130" y="125" class="text-title">PRIMARY SOURCE TEXT</text>
  <line x1="130" y1="140" x2="350" y2="140" class="stroke-subtle"/>
  
  <!-- Text lines representation -->
  <rect x="130" y="160" width="220" height="6" rx="3" fill="var(--text-muted, #77727E)" opacity="0.4"/>
  <rect x="130" y="178" width="190" height="6" rx="3" fill="var(--text-muted, #77727E)" opacity="0.4"/>
  <rect x="130" y="196" width="210" height="6" rx="3" fill="var(--text-muted, #77727E)" opacity="0.4"/>
  
  <!-- Highlight region -->
  <rect x="130" y="214" width="220" height="24" rx="3" fill="var(--accent-soft, #3A3445)"/>
  <rect x="138" y="223" width="180" height="6" rx="3" fill="var(--accent, #9D84B7)"/>
  
  <rect x="130" y="248" width="200" height="6" rx="3" fill="var(--text-muted, #77727E)" opacity="0.4"/>
  <rect x="130" y="266" width="160" height="6" rx="3" fill="var(--text-muted, #77727E)" opacity="0.4"/>
  
  <text x="130" y="320" class="text-code">§ 01 : FORCED ENCODING</text>
  <rect x="130" y="340" width="220" height="6" rx="3" fill="var(--text-muted, #77727E)" opacity="0.4"/>
  <rect x="130" y="358" width="170" height="6" rx="3" fill="var(--text-muted, #77727E)" opacity="0.4"/>

  <!-- Middle Connection Vector -->
  <path d="M 370 226 C 390 226, 410 200, 430 200" class="stroke-accent" fill="none" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="430" cy="200" r="4" fill="var(--accent, #9D84B7)"/>

  <!-- Right Pane: Active Recall Synthesis -->
  <rect x="430" y="90" width="260" height="320" rx="4" class="stroke-accent" stroke-width="1.5"/>
  <text x="450" y="125" class="text-title">SYNTHESIZED RECALL</text>
  <line x1="450" y1="140" x2="670" y2="140" class="stroke-subtle"/>

  <text x="450" y="170" class="text-code">Q: CORE INSIGHT</text>
  <rect x="450" y="185" width="220" height="8" rx="4" fill="var(--accent, #9D84B7)" opacity="0.8"/>
  <rect x="450" y="202" width="180" height="8" rx="4" fill="var(--accent, #9D84B7)" opacity="0.6"/>

  <line x1="450" y1="230" x2="670" y2="230" class="stroke-subtle"/>

  <!-- Spaced Interval Curve -->
  <text x="450" y="258" class="text-title">RETRIEVAL PROMPT INTERVAL</text>
  <path d="M 450 330 Q 510 330, 530 295 T 620 295 T 670 280" class="stroke-accent" fill="none"/>
  
  <circle cx="450" cy="330" r="3.5" fill="var(--accent, #9D84B7)"/>
  <text x="444" y="352" class="text-code">1D</text>

  <circle cx="530" cy="295" r="3.5" fill="var(--accent, #9D84B7)"/>
  <text x="524" y="352" class="text-code">3D</text>

  <circle cx="620" cy="295" r="3.5" fill="var(--accent, #9D84B7)"/>
  <text x="614" y="352" class="text-code">7D</text>

  <circle cx="670" cy="280" r="3.5" fill="var(--accent, #9D84B7)"/>
  <text x="660" y="352" class="text-code">30D</text>

  <!-- Editorial Metadata Tag -->
  <text x="110" y="435" class="text-body">INLIVEIQ LAB // COGNITIVE NOTE ARCHITECTURE</text>
  <text x="620" y="435" class="text-code">EXP-01 [LOCAL]</text>
</svg>
