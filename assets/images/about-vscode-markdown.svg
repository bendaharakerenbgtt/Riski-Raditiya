<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="100%" height="100%" aria-hidden="true">
  <defs>
    <radialGradient id="mdAura" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#007acc" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#4ec9b0" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#1e1e1e" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <ellipse cx="210" cy="170" rx="195" ry="155" fill="url(#mdAura)" />

  <!-- Back Window Layer (Split Editor Code) -->
  <rect x="24" y="28" width="320" height="240" rx="8" fill="#1e1e1e" stroke="#3c3c3c" stroke-width="1.5" />
  <!-- Tab Bar -->
  <rect x="24" y="28" width="320" height="28" rx="8" fill="#252526" />
  <rect x="24" y="48" width="320" height="8" fill="#252526" />
  <rect x="24" y="28" width="125" height="28" rx="6" fill="#1e1e1e" />
  <line x1="24" y1="29" x2="149" y2="29" stroke="#007acc" stroke-width="2" />
  <text x="40" y="46" fill="#519aba" font-family="ui-monospace, Consolas, monospace" font-size="10.5" font-weight="700">MD</text>
  <text x="62" y="46" fill="#d4d4d4" font-family="ui-monospace, Consolas, monospace" font-size="10.5">about.md</text>

  <!-- Code Lines with Gutter -->
  <g font-family="ui-monospace, Consolas, monospace" font-size="10.5">
    <text x="42" y="80" fill="#555555">1</text>
    <text x="64" y="80" fill="#569cd6" font-weight="700"># Riski Raditiya</text>

    <text x="42" y="102" fill="#555555">2</text>
    <text x="64" y="102" fill="#6a9955">&gt; Curiosity -&gt; Experiment -&gt; Share</text>

    <text x="42" y="124" fill="#555555">3</text>
    <text x="64" y="124" fill="#c586c0">const</text>
    <text x="102" y="124" fill="#9cdcfe">mindset</text>
    <text x="152" y="124" fill="#d4d4d4">=</text>
    <text x="164" y="124" fill="#ce9178">"Observe &amp; Build"</text>

    <text x="42" y="146" fill="#555555">4</text>
    <text x="64" y="146" fill="#4ec9b0">function</text>
    <text x="120" y="146" fill="#dcdcaa">learn</text>
    <text x="154" y="146" fill="#d4d4d4">(idea) {</text>

    <text x="42" y="168" fill="#555555">5</text>
    <text x="80" y="168" fill="#c586c0">return</text>
    <text x="124" y="168" fill="#9cdcfe">test</text>
    <text x="152" y="168" fill="#d4d4d4">(idea).share();</text>

    <text x="42" y="190" fill="#555555">6</text>
    <text x="64" y="190" fill="#d4d4d4">}</text>
  </g>

  <!-- Foreground Floating Preview Card (Markdown Preview) -->
  <g>
    <rect x="126" y="146" width="268" height="162" rx="8" fill="#252526" stroke="#007acc" stroke-width="1.5" />
    <rect x="126" y="146" width="268" height="26" rx="8" fill="#2d2d2d" />
    <rect x="126" y="164" width="268" height="8" fill="#2d2d2d" />
    <circle cx="142" cy="159" r="3.5" fill="#ff5f56" />
    <circle cx="154" cy="159" r="3.5" fill="#ffbd2e" />
    <circle cx="166" cy="159" r="3.5" fill="#27c93f" />
    <text x="184" y="163" fill="#9cdcfe" font-family="ui-monospace, Consolas, monospace" font-size="9.5">Preview: about.md</text>

    <!-- Preview Content -->
    <text x="146" y="196" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="700">Observe. Understand. Build.</text>
    <line x1="146" y1="206" x2="372" y2="206" stroke="#3c3c3c" stroke-width="1" />

    <!-- Simulated Markdown Badges / Status -->
    <rect x="146" y="220" width="94" height="22" rx="4" fill="#1e1e1e" stroke="#4ec9b0" stroke-width="1" />
    <text x="193" y="235" fill="#4ec9b0" font-family="ui-monospace, Consolas, monospace" font-size="9.5" text-anchor="middle">Curiosity</text>

    <rect x="248" y="220" width="106" height="22" rx="4" fill="#1e1e1e" stroke="#569cd6" stroke-width="1" />
    <text x="301" y="235" fill="#9cdcfe" font-family="ui-monospace, Consolas, monospace" font-size="9.5" text-anchor="middle">Experiment</text>

    <rect x="146" y="252" width="128" height="22" rx="4" fill="#1e1e1e" stroke="#ce9178" stroke-width="1" />
    <text x="210" y="267" fill="#ce9178" font-family="ui-monospace, Consolas, monospace" font-size="9.5" text-anchor="middle">Knowledge Sharing</text>

    <!-- Live Blinking Cursor -->
    <rect x="284" y="256" width="2" height="14" fill="#007acc">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
