<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%" aria-hidden="true">
  <defs>
    <!-- White Glow Filters -->
    <filter id="whiteGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Radial Gradients for Fan Blade -->
    <radialGradient id="fanGrad" cx="50%" cy="85%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#eaeef4" stop-opacity="0.85" />
      <stop offset="75%" stop-color="#2a2d35" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#121318" stop-opacity="0.9" />
    </radialGradient>
    <linearGradient id="ribGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8c92a4" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="tasselGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#d6dae2" />
      <stop offset="100%" stop-color="#808696" />
    </linearGradient>
  </defs>

  <!-- Ambient Background Aura -->
  <circle cx="250" cy="180" r="140" fill="#ffffff" fill-opacity="0.04" filter="url(#whiteGlow)" />
  <circle cx="250" cy="180" r="90" fill="#ffffff" fill-opacity="0.08" filter="url(#whiteGlow)" />

  <!-- Unfolded Fan Arc Body -->
  <g filter="url(#softGlow)">
    <path d="M 70 230 C 95 110, 160 50, 250 50 C 340 50, 405 110, 430 230 L 290 255 C 275 235, 225 235, 210 255 Z" 
          fill="url(#fanGrad)" stroke="rgba(255,255,255,0.7)" stroke-width="1.8" />
  </g>

  <!-- Fan Ribs / Radiating Slats -->
  <g stroke="url(#ribGrad)" stroke-width="1.2" opacity="0.65">
    <line x1="250" y1="260" x2="80" y2="225" />
    <line x1="250" y1="260" x2="110" y2="175" />
    <line x1="250" y1="260" x2="150" y2="125" />
    <line x1="250" y1="260" x2="200" y2="80" />
    <line x1="250" y1="260" x2="250" y2="55" />
    <line x1="250" y1="260" x2="300" y2="80" />
    <line x1="250" y1="260" x2="350" y2="125" />
    <line x1="250" y1="260" x2="390" y2="175" />
    <line x1="250" y1="260" x2="420" y2="225" />
  </g>

  <!-- Delicate Blossom Branches Painted on Fan -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 170 200 Q 220 160, 280 140 T 360 110" />
    <path d="M 230 168 Q 260 130, 290 115" />
    <path d="M 270 145 Q 295 165, 330 155" />
  </g>

  <!-- Blossoms & Petals on Fan (Glowing White) -->
  <g fill="#ffffff" filter="url(#softGlow)">
    <!-- Blossom 1 -->
    <circle cx="280" cy="140" r="4.5" fill="#ffffff" />
    <circle cx="274" cy="136" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="286" cy="136" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="276" cy="146" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="284" cy="146" r="3" fill="#ffffff" opacity="0.8" />
    <!-- Blossom 2 -->
    <circle cx="260" cy="130" r="4" fill="#ffffff" />
    <circle cx="255" cy="126" r="2.8" fill="#ffffff" opacity="0.8" />
    <circle cx="265" cy="126" r="2.8" fill="#ffffff" opacity="0.8" />
    <circle cx="260" cy="135" r="2.8" fill="#ffffff" opacity="0.8" />
    <!-- Blossom 3 -->
    <circle cx="330" cy="120" r="4.5" fill="#ffffff" />
    <circle cx="324" cy="116" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="336" cy="116" r="3" fill="#ffffff" opacity="0.8" />
    <circle cx="328" cy="126" r="3" fill="#ffffff" opacity="0.8" />
    <!-- Floating Petals -->
    <ellipse cx="210" cy="145" rx="3" ry="1.5" transform="rotate(-25 210 145)" fill="#ffffff" opacity="0.9" />
    <ellipse cx="310" cy="95" rx="3.5" ry="1.8" transform="rotate(35 310 95)" fill="#ffffff" opacity="0.9" />
    <ellipse cx="360" cy="140" rx="3" ry="1.5" transform="rotate(-15 360 140)" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Fan Pivot Ring & Base Handle -->
  <circle cx="250" cy="265" r="8" fill="#ffffff" filter="url(#softGlow)" />
  <circle cx="250" cy="265" r="4" fill="#121318" />

  <!-- Hanging White Silk Cord and Tassel -->
  <g filter="url(#softGlow)">
    <!-- Silk Cord -->
    <path d="M 250 273 C 250 295, 246 310, 248 325" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" />
    
    <!-- Chinese Knot / Ornament -->
    <rect x="243" y="300" width="10" height="10" rx="2" fill="#ffffff" transform="rotate(45 248 305)" />
    
    <!-- Tassel Head -->
    <ellipse cx="248" cy="330" rx="6" ry="4" fill="#ffffff" />
    
    <!-- Tassel Strands -->
    <path d="M 243 332 L 238 385 M 245 334 L 243 390 M 248 334 L 248 395 M 251 334 L 253 390 M 253 332 L 258 385" 
          stroke="url(#tasselGrad)" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
