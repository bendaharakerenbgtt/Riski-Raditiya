<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 400" width="100%" height="100%" aria-hidden="true">
  <defs>
    <!-- VS Code Blue & Teal Ambient Glow -->
    <radialGradient id="lensAura" cx="48%" cy="46%" r="54%">
      <stop offset="0%" stop-color="#007acc" stop-opacity="0.34" />
      <stop offset="45%" stop-color="#4ec9b0" stop-opacity="0.14" />
      <stop offset="78%" stop-color="#007acc" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#1e1e1e" stop-opacity="0" />
    </radialGradient>

    <!-- Glass Refraction Core -->
    <radialGradient id="glassCoreGlow" cx="46%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#4ec9b0" stop-opacity="0.55" />
      <stop offset="38%" stop-color="#007acc" stop-opacity="0.28" />
      <stop offset="72%" stop-color="#252526" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#1e1e1e" stop-opacity="0.75" />
    </radialGradient>

    <!-- Specular Lens Glare -->
    <linearGradient id="lensSpecular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#9cdcfe" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="100%" stop-color="#4ec9b0" stop-opacity="0.35" />
    </linearGradient>

    <!-- Anodized IDE Frame Gradient -->
    <linearGradient id="rimMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9cdcfe" />
      <stop offset="28%" stop-color="#007acc" />
      <stop offset="55%" stop-color="#252526" />
      <stop offset="80%" stop-color="#3c3c3c" />
      <stop offset="100%" stop-color="#4ec9b0" />
    </linearGradient>

    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c3c3c" />
      <stop offset="45%" stop-color="#252526" />
      <stop offset="100%" stop-color="#181818" />
    </linearGradient>

    <linearGradient id="sparkAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#9cdcfe" />
      <stop offset="100%" stop-color="#4ec9b0" />
    </linearGradient>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="210" cy="180" r="175" fill="url(#lensAura)" />

  <!-- Slowly Rotating Outer Telemetry Ring -->
  <g>
    <circle cx="210" cy="180" r="162" fill="none" stroke="#007acc" stroke-opacity="0.35" stroke-width="1.3" stroke-dasharray="4 7" />
    <circle cx="210" cy="180" r="148" fill="none" stroke="#4ec9b0" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="16 12" />
    <animateTransform attributeName="transform" type="rotate" from="0 210 180" to="360 210 180" dur="90s" repeatCount="indefinite" />
  </g>

  <!-- Subtle Inspection Crosshairs -->
  <g stroke="#569cd6" stroke-opacity="0.22" stroke-width="1">
    <line x1="210" y1="20" x2="210" y2="340" stroke-dasharray="4 6" />
    <line x1="50" y1="180" x2="370" y2="180" stroke-dasharray="4 6" />
  </g>

  <!-- Code & Cube Specimen Inside Focal View -->
  <g stroke="#9cdcfe" stroke-width="1.3" fill="none" stroke-opacity="0.55">
    <polygon points="210,132 244,151 210,170 176,151" />
    <polygon points="176,151 210,170 210,208 176,189" stroke="#569cd6" stroke-opacity="0.5" />
    <polygon points="244,151 210,170 210,208 244,189" stroke="#4ec9b0" stroke-opacity="0.55" />
    <circle cx="210" cy="132" r="2.5" fill="#dcdcaa" stroke="none" />
    <circle cx="244" cy="151" r="2.5" fill="#4ec9b0" stroke="none" />
    <circle cx="176" cy="151" r="2.5" fill="#ce9178" stroke="none" />
  </g>

  <!-- Sculptural Precision Lens -->
  <g>
    <path d="M 288 258 L 398 368 A 12 12 0 0 1 382 384 L 272 274 Z" fill="#000000" opacity="0.45" />

    <!-- Ergonomic Metal Handle -->
    <g>
      <polygon points="280,250 292,262 284,270 272,258" fill="url(#rimMetal)" stroke="#9cdcfe" stroke-width="1" stroke-opacity="0.5" />
      <path d="M 288 258 L 388 358 Q 394 364 388 370 L 376 382 Q 370 388 364 382 L 264 282 Z"
            fill="url(#handleGrad)"
            stroke="#007acc"
            stroke-opacity="0.65"
            stroke-width="1.5"
            stroke-linejoin="round" />
      <g stroke="#9cdcfe" stroke-opacity="0.32" stroke-width="1.2">
        <line x1="298" y1="284" x2="284" y2="298" />
        <line x1="316" y1="302" x2="302" y2="316" />
        <line x1="334" y1="320" x2="320" y2="334" />
        <line x1="352" y1="338" x2="338" y2="352" />
      </g>
      <circle cx="380" cy="374" r="8" fill="url(#rimMetal)" stroke="#9cdcfe" stroke-width="1.2" stroke-opacity="0.7" />
      <circle cx="380" cy="374" r="3" fill="#4ec9b0" />
    </g>

    <!-- Outer Bezel Retaining Ring -->
    <circle cx="200" cy="170" r="115" fill="none" stroke="#007acc" stroke-opacity="0.22" stroke-width="16" />
    <circle cx="200" cy="170" r="115" fill="none" stroke="url(#rimMetal)" stroke-width="7.5" />
    <circle cx="200" cy="170" r="119" fill="none" stroke="#9cdcfe" stroke-opacity="0.4" stroke-width="1.1" />

    <!-- Convex Glass Disc -->
    <circle cx="200" cy="170" r="108" fill="url(#glassCoreGlow)" />

    <!-- Specular Glare -->
    <path d="M 126 102 C 166 68, 234 68, 274 102 C 260 88, 208 80, 160 92 C 138 98, 128 102, 126 102 Z"
          fill="url(#lensSpecular)" />

    <!-- Syntax Code Brackets & Insight Spark -->
    <g>
      <circle cx="200" cy="170" r="34" fill="#007acc" fill-opacity="0.22">
        <animate attributeName="r" values="28;42;28" dur="3.2s" repeatCount="indefinite" />
        <animate attributeName="fill-opacity" values="0.26;0.08;0.26" dur="3.2s" repeatCount="indefinite" />
      </circle>

      <!-- Left & Right Code Chevrons < > -->
      <path d="M 156 158 L 142 170 L 156 182" fill="none" stroke="#569cd6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 244 158 L 258 170 L 244 182" fill="none" stroke="#569cd6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Center Insight Spark -->
      <path d="M 200 138 C 202 158, 212 168, 232 170 C 212 172, 202 182, 200 202 C 198 182, 188 172, 168 170 C 188 168, 198 158, 200 138 Z"
            fill="url(#sparkAccent)" />
      <path d="M 225 142 C 226 148, 228 150, 234 151 C 228 152, 226 154, 225 160 C 224 154, 222 152, 216 151 C 222 150, 224 148, 225 142 Z"
            fill="#dcdcaa" opacity="0.95" />
    </g>
  </g>
</svg>
