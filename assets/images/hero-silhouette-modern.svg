<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="100%" height="100%" aria-hidden="true">
  <defs>
    <!-- Multi-stage Luminescent White Glow Filters -->
    <filter id="pureWhiteGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="livingAura" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="25" result="softBlur" />
      <feMerge>
        <feMergeNode in="softBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Radial Halo Background Gradient -->
    <radialGradient id="haloBg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#c5ccd8" stop-opacity="0.14" />
      <stop offset="70%" stop-color="#121520" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0a0c13" stop-opacity="0" />
    </radialGradient>

    <!-- Sleek Monochromatic Shading for Body Silhouette -->
    <linearGradient id="bodySilhouetteGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#242838" />
      <stop offset="30%" stop-color="#181b28" />
      <stop offset="70%" stop-color="#10121c" />
      <stop offset="100%" stop-color="#090b10" />
    </linearGradient>

    <linearGradient id="rimLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#eef2f9" />
      <stop offset="100%" stop-color="#9098ac" />
    </linearGradient>
  </defs>

  <!-- Ambient Living Atmosphere / Aura Behind Figure -->
  <g class="ambient-aura-layer">
    <ellipse cx="250" cy="270" rx="190" ry="210" fill="url(#haloBg)" filter="url(#livingAura)" />
    <!-- Fine Concentric Geometry (Modern Architectural Aesthetic) -->
    <circle cx="250" cy="230" r="140" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.2" stroke-dasharray="4,6" />
    <circle cx="250" cy="230" r="190" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  </g>

  <!-- Outer Luminous White Rim Lighting Silhouette (Edge Glow) -->
  <g filter="url(#pureWhiteGlow)">
    <!-- Shoulders & Coat / Minimalist Blazer Contours (Sits flush at y=620) -->
    <path d="M 60 620 
             L 75 500 
             C 90 420, 130 360, 195 335
             L 215 325 
             L 285 325 
             L 305 335 
             C 370 360, 410 420, 425 500 
             L 440 620 Z" 
          fill="none" 
          stroke="url(#rimLightGrad)" 
          stroke-width="3.5" 
          stroke-linecap="round" />

    <!-- Neck & Jawline Rim Light -->
    <path d="M 215 325 L 218 245 C 218 200, 235 170, 250 170 C 265 170, 282 200, 282 245 L 285 325" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="2.5" />

    <!-- Modern Sharp Head & Hair Contour Rim Light -->
    <path d="M 218 205 
             C 210 175, 212 135, 230 100 
             C 240 80, 260 80, 270 100 
             C 288 135, 290 175, 282 205" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="3" />

    <!-- Sharp Modern Hair Fade / Fringe Details -->
    <path d="M 230 100 Q 250 65, 270 100" stroke="#ffffff" stroke-width="2.5" fill="none" />
    <path d="M 235 85 Q 250 55, 265 85" stroke="rgba(255,255,255,0.8)" stroke-width="1.8" fill="none" />
  </g>

  <!-- Main Solid Silhouette Body (Modern High-Fashion / Minimalist Tech Figure) -->
  <g>
    <!-- Shoulders / Blazer Trunk (Cuts off cleanly at y=620) -->
    <path d="M 58 620 
             L 74 498 
             C 89 418, 128 358, 194 334 
             L 214 324 
             L 286 324 
             L 306 334 
             C 372 358, 411 418, 426 498 
             L 442 620 Z" 
          fill="url(#bodySilhouetteGrad)" />

    <!-- Blazer Lapel & Minimalist Seam Highlights (Subtle Platinum Sheen) -->
    <path d="M 214 324 L 246 450 L 250 620" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" fill="none" />
    <path d="M 286 324 L 254 450 L 250 620" stroke="rgba(255,255,255,0.3)" stroke-width="1.2" fill="none" />
    <!-- High Collar / Turtleneck Layer -->
    <path d="M 214 324 Q 250 340, 286 324 L 282 265 Q 250 275, 218 265 Z" fill="#141724" stroke="rgba(255,255,255,0.3)" stroke-width="1" />

    <!-- Neck Silhouette -->
    <path d="M 218 265 L 220 220 C 220 185, 235 175, 250 175 C 265 175, 280 185, 280 220 L 282 265 Z" fill="#181c2b" />

    <!-- Head & Jaw Silhouette -->
    <path d="M 212 185 
             C 210 230, 235 245, 250 245 
             C 265 245, 290 230, 288 185 
             C 288 140, 285 110, 270 95 
             C 255 85, 245 85, 230 95 
             C 215 110, 212 140, 212 185 Z" 
          fill="#1b1f30" />

    <!-- Hair Silhouette (Modern Textured Cut) -->
    <path d="M 208 175 
             C 205 130, 220 85, 245 70 
             C 260 70, 285 85, 292 130 
             C 295 155, 292 175, 288 180 
             C 285 150, 275 115, 250 115 
             C 225 115, 215 150, 208 175 Z" 
          fill="#0c0e16" 
          stroke="rgba(255,255,255,0.25)" 
          stroke-width="1" />

    <!-- Modern Minimalist Eyewear / Horizon Visor (Sleek Tech Accent) -->
    <g filter="url(#pureWhiteGlow)">
      <rect x="222" y="165" width="24" height="12" rx="3" fill="#ffffff" fill-opacity="0.95" />
      <rect x="254" y="165" width="24" height="12" rx="3" fill="#ffffff" fill-opacity="0.95" />
      <line x1="246" y1="171" x2="254" y2="171" stroke="#ffffff" stroke-width="2" />
      <!-- Specular Reflection -->
      <line x1="225" y1="168" x2="238" y2="168" stroke="#0a0c13" stroke-width="1.8" stroke-linecap="round" />
      <line x1="257" y1="168" x2="270" y2="168" stroke="#0a0c13" stroke-width="1.8" stroke-linecap="round" />
    </g>
  </g>

  <!-- Living Thought Constellations (Subtle Ambient Synaptic Micro-Nodes) -->
  <g fill="#ffffff" filter="url(#pureWhiteGlow)">
    <circle cx="160" cy="200" r="2.5" opacity="0.9" />
    <circle cx="130" cy="240" r="1.8" opacity="0.6" />
    <circle cx="180" cy="140" r="2" opacity="0.8" />
    <circle cx="340" cy="190" r="2.5" opacity="0.9" />
    <circle cx="370" cy="230" r="1.8" opacity="0.6" />
    <circle cx="320" cy="130" r="2" opacity="0.8" />
    <!-- Fine Synaptic Connectors -->
    <line x1="160" y1="200" x2="180" y2="140" stroke="rgba(255,255,255,0.2)" stroke-width="0.8" />
    <line x1="340" y1="190" x2="320" y2="130" stroke="rgba(255,255,255,0.2)" stroke-width="0.8" />
  </g>

  <!-- Flat Base Horizon Alignment Guide at y=620 (Blends directly onto the ticker line) -->
  <line x1="0" y1="620" x2="500" y2="620" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
</svg>
