<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .bg { fill: var(--card-canvas-bg, #27262D); }
      .stroke-subtle { stroke: var(--border-subtle, #3A3844); stroke-width: 1.5; }
      .stroke-accent { stroke: var(--accent, #9D84B7); stroke-width: 2; }
      .text-title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--text-primary, #F0EFEB); letter-spacing: 0.08em; }
      .text-body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 11px; fill: var(--text-secondary, #9E9AA7); }
      .text-code { font-family: monospace; font-size: 10px; fill: var(--accent, #9D84B7); }
    </style>
  </defs>

  <rect width="800" height="450" rx="8" class="bg"/>

  <!-- Synthesis Funnel Schema -->
  <!-- Raw Information Noise (Scattered points on left) -->
  <text x="120" y="80" class="text-title">ACCUMULATED ARTIFACTS</text>
  <text x="120" y="100" class="text-body">(Passive collection, highlights, bookmarks)</text>

  <!-- Dots representing fragmented information -->
  <circle cx="130" cy="150" r="3" fill="var(--text-muted, #77727E)"/>
  <circle cx="160" cy="170" r="3.5" fill="var(--text-muted, #77727E)"/>
  <circle cx="140" cy="210" r="3" fill="var(--text-muted, #77727E)"/>
  <circle cx="180" cy="240" r="4" fill="var(--text-muted, #77727E)"/>
  <circle cx="150" cy="280" r="3" fill="var(--text-muted, #77727E)"/>
  <circle cx="210" cy="180" r="3" fill="var(--text-muted, #77727E)"/>
  <circle cx="190" cy="310" r="3.5" fill="var(--text-muted, #77727E)"/>
  <circle cx="230" cy="260" r="3" fill="var(--text-muted, #77727E)"/>

  <!-- Funnel Converging lines -->
  <path d="M 270 140 L 410 215" class="stroke-subtle"/>
  <path d="M 270 320 L 410 245" class="stroke-subtle"/>

  <!-- Cognitive Synthesis Filter Gate -->
  <rect x="410" y="190" width="30" height="80" rx="4" class="stroke-accent" fill="var(--accent-soft, #3A3445)"/>
  <text x="375" y="170" class="text-code">COGNITIVE FILTER</text>
  <text x="390" y="295" class="text-code">[SYNTHESIS]</text>

  <!-- Emergence of Synthesized Essence (Distilled Atomic Principle) -->
  <path d="M 440 230 L 530 230" class="stroke-accent" stroke-dasharray="3 3"/>
  <circle cx="580" cy="230" r="32" class="stroke-accent" stroke-width="2" fill="var(--card-canvas-bg, #27262D)"/>
  <circle cx="580" cy="230" r="6" fill="var(--accent, #9D84B7)"/>
  
  <text x="540" y="295" class="text-title">INTERNALIZED ESSENCE</text>
  <text x="530" y="315" class="text-body">Articulated in own words</text>
  <text x="548" y="335" class="text-code">RETAINED FOR LIFE</text>

  <line x1="80" y1="390" x2="720" y2="390" class="stroke-subtle" stroke-dasharray="2 4"/>
  <text x="80" y="415" class="text-body">INLIVEIQ ESSAY // RETRIEVAL DYNAMICS &amp; ENCODING</text>
  <text x="635" y="415" class="text-code">OCTOBER 2026</text>
</svg>
