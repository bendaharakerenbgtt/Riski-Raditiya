<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" width="100%" height="100%" aria-hidden="true">
  <defs>
    <filter id="portraitWhiteGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <radialGradient id="auraBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#d0d7e5" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f2eb" />
      <stop offset="50%" stop-color="#d8d4cb" />
      <stop offset="100%" stop-color="#9ea0a8" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d3039" />
      <stop offset="100%" stop-color="#14151a" />
    </linearGradient>
    <linearGradient id="robeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#c8cfdc" />
      <stop offset="100%" stop-color="#2a2d36" />
    </linearGradient>
  </defs>

  <!-- Ambient Glowing Backdrop Disk -->
  <circle cx="230" cy="240" r="180" fill="url(#auraBg)" filter="url(#portraitWhiteGlow)" />
  <circle cx="230" cy="240" r="140" fill="#ffffff" fill-opacity="0.05" filter="url(#portraitWhiteGlow)" />

  <!-- Outer Luminous White Aura Silhouette Outline -->
  <g filter="url(#portraitWhiteGlow)" opacity="0.95">
    <!-- Glowing Robe / Jacket Rim -->
    <path d="M 120 540 C 130 420, 160 360, 200 340 L 220 330 L 250 330 L 270 340 C 310 360, 340 420, 350 540 Z" 
          fill="none" stroke="#ffffff" stroke-width="6" />
    <!-- Glowing Neck / Face Rim -->
    <path d="M 200 240 Q 230 300, 260 240 Q 275 190, 260 140 Q 200 135, 200 240 Z" 
          fill="none" stroke="#ffffff" stroke-width="4.5" />
    <!-- Hair Bun / Silhouette Glow -->
    <ellipse cx="230" cy="115" rx="50" ry="45" fill="none" stroke="#ffffff" stroke-width="4" />
  </g>

  <!-- Solid Figure Rendering -->
  <!-- 1. Robe / Kimono / Jacket -->
  <path d="M 115 560 C 128 410, 160 355, 205 335 L 230 365 L 255 335 C 300 355, 332 410, 345 560 Z" 
        fill="url(#robeGrad)" stroke="#ffffff" stroke-width="1.5" />

  <!-- Robe Lapel Fold & Pattern -->
  <path d="M 205 335 L 245 430 L 230 560" stroke="#ffffff" stroke-width="2.5" fill="none" />
  <path d="M 255 335 L 215 430 L 230 560" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.7" />

  <!-- Robe Floral Texture Accent (Delicate Stippling) -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="165" cy="440" r="2.5" />
    <circle cx="175" cy="450" r="3" />
    <circle cx="185" cy="435" r="2" />
    <circle cx="295" cy="440" r="2.5" />
    <circle cx="285" cy="450" r="3" />
    <circle cx="275" cy="435" r="2" />
  </g>

  <!-- 2. Neck and Collarbones -->
  <path d="M 210 340 L 215 260 L 245 260 L 250 340 Z" fill="url(#skinGrad)" />
  <path d="M 218 310 Q 230 325, 242 310" stroke="#9094a0" stroke-width="1.8" fill="none" stroke-linecap="round" />

  <!-- 3. Face and Chin Contour -->
  <path d="M 195 200 C 195 250, 218 275, 230 275 C 242 275, 265 250, 265 200 C 265 150, 195 150, 195 200 Z" 
        fill="url(#skinGrad)" />

  <!-- 4. Hair (Detailed Bun and Strands) -->
  <path d="M 185 180 C 180 130, 210 95, 230 95 C 250 95, 280 130, 275 180 C 275 160, 265 140, 230 140 C 195 140, 185 160, 185 180 Z" 
        fill="url(#hairGrad)" />
  <!-- Hair Bun on Top -->
  <ellipse cx="230" cy="90" rx="38" ry="32" fill="url(#hairGrad)" stroke="#ffffff" stroke-width="1.5" />
  <!-- Traditional Hairpin / Kanzashi (White Glow) -->
  <g filter="url(#portraitWhiteGlow)">
    <line x1="180" y1="95" x2="280" y2="75" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <circle cx="280" cy="75" r="6" fill="#ffffff" />
    <!-- Tassel hanging from hairpin -->
    <path d="M 280 81 L 280 115" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="3,2" />
    <circle cx="280" cy="118" r="3" fill="#ffffff" />
  </g>

  <!-- Tendrils / Wisps of Hair -->
  <path d="M 188 190 Q 182 230, 190 250" stroke="#2d3039" stroke-width="2.5" fill="none" stroke-linecap="round" />
  <path d="M 272 190 Q 278 230, 270 250" stroke="#2d3039" stroke-width="2.5" fill="none" stroke-linecap="round" />

  <!-- 5. Cybernetic Sunglasses / Eyewear (Luminous White Tint) -->
  <g filter="url(#portraitWhiteGlow)">
    <!-- Sleek Rectangular Frame -->
    <rect x="202" y="185" width="24" height="15" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" />
    <rect x="234" y="185" width="24" height="15" rx="3" fill="#ffffff" stroke="#ffffff" stroke-width="1.5" />
    <line x1="226" y1="192" x2="234" y2="192" stroke="#ffffff" stroke-width="2" />
    <!-- Sunglass Bridge & Temple -->
    <line x1="192" y1="188" x2="202" y2="188" stroke="#ffffff" stroke-width="1.5" />
    <line x1="258" y1="188" x2="268" y2="188" stroke="#ffffff" stroke-width="1.5" />
    <!-- Specular Highlight Gleam -->
    <line x1="205" y1="188" x2="220" y2="188" stroke="#121318" stroke-width="2" stroke-linecap="round" />
    <line x1="237" y1="188" x2="252" y2="188" stroke="#121318" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Lips and Facial Structure -->
  <path d="M 224 238 Q 230 242, 236 238" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" />
  <path d="M 226 242 Q 230 246, 234 242" stroke="#6b6f7a" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <!-- Earring / Ear Cuff -->
  <circle cx="193" cy="225" r="3.5" fill="#ffffff" filter="url(#portraitWhiteGlow)" />
  <circle cx="267" cy="225" r="3.5" fill="#ffffff" filter="url(#portraitWhiteGlow)" />
</svg>
