<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .bg { fill: var(--card-canvas-bg, #27262D); }
      .stroke-subtle { stroke: var(--border-subtle, #3A3844); stroke-width: 1.5; }
      .stroke-accent { stroke: var(--accent, #9D84B7); stroke-width: 2; }
      .text-title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--text-primary, #F0EFEB); letter-spacing: 0.08em; }
      .text-body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 11px; fill: var(--text-secondary, #9E9AA7); }
      .text-code { font-family: monospace; font-size: 10px; fill: var(--accent, #9D84B7); }
    </style>
  </defs>

  <rect width="800" height="500" rx="8" class="bg"/>

  <!-- Editorial Typographic Measure Ruler -->
  <line x1="100" y1="80" x2="700" y2="80" class="stroke-subtle"/>
  <line x1="100" y1="75" x2="100" y2="85" class="stroke-subtle"/>
  <line x1="250" y1="75" x2="250" y2="85" class="stroke-subtle"/>
  <line x1="400" y1="75" x2="400" y2="85" class="stroke-subtle"/>
  <line x1="550" y1="75" x2="550" y2="85" class="stroke-subtle"/>
  <line x1="700" y1="75" x2="700" y2="85" class="stroke-subtle"/>
  
  <text x="100" y="68" class="text-code">0 CH</text>
  <text x="375" y="68" class="text-code">OPTIMAL: 65 CH MEASURE</text>
  <text x="660" y="68" class="text-code">100 CH</text>

  <!-- Eye Movement Saccades & Reading Flow Overlay -->
  <!-- Line 1 -->
  <line x1="140" y1="140" x2="620" y2="140" stroke="var(--text-muted, #77727E)" stroke-width="8" stroke-linecap="round" opacity="0.25"/>
  <path d="M 140 140 Q 230 132, 280 140 T 430 140 T 570 140" class="stroke-accent" stroke-dasharray="3 3"/>
  <circle cx="140" cy="140" r="4.5" fill="var(--accent, #9D84B7)"/>
  <circle cx="280" cy="140" r="3.5" fill="var(--accent, #9D84B7)"/>
  <circle cx="430" cy="140" r="4" fill="var(--accent, #9D84B7)"/>
  <circle cx="570" cy="140" r="5" fill="var(--accent, #9D84B7)"/>

  <!-- Return Sweep (Saccade) -->
  <path d="M 570 140 C 400 170, 220 170, 140 195" stroke="var(--accent, #9D84B7)" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.6"/>

  <!-- Line 2 -->
  <line x1="140" y1="195" x2="590" y2="195" stroke="var(--text-muted, #77727E)" stroke-width="8" stroke-linecap="round" opacity="0.25"/>
  <circle cx="140" cy="195" r="4.5" fill="var(--accent, #9D84B7)"/>
  <circle cx="290" cy="195" r="3.5" fill="var(--accent, #9D84B7)"/>
  <circle cx="450" cy="195" r="4.5" fill="var(--accent, #9D84B7)"/>

  <!-- Return Sweep 2 -->
  <path d="M 450 195 C 330 225, 200 225, 140 250" stroke="var(--accent, #9D84B7)" stroke-width="1.5" stroke-dasharray="2 4" opacity="0.6"/>

  <!-- Line 3 -->
  <line x1="140" y1="250" x2="640" y2="250" stroke="var(--text-muted, #77727E)" stroke-width="8" stroke-linecap="round" opacity="0.25"/>
  <circle cx="140" cy="250" r="4.5" fill="var(--accent, #9D84B7)"/>
  <circle cx="310" cy="250" r="4" fill="var(--accent, #9D84B7)"/>
  <circle cx="490" cy="250" r="4" fill="var(--accent, #9D84B7)"/>
  <circle cx="630" cy="250" r="4.5" fill="var(--accent, #9D84B7)"/>

  <!-- Diagnostic Metrics Panel -->
  <rect x="100" y="300" width="600" height="110" rx="4" class="stroke-subtle"/>
  
  <text x="130" y="335" class="text-title">COGNITIVE LOAD RATIO</text>
  <text x="130" y="365" class="text-code">LUMINANCE RATIO: 11.2:1 (OPTIMAL)</text>
  <text x="130" y="388" class="text-code">LINE PITCH: 1.72 REM</text>

  <!-- Metric bars -->
  <line x1="420" y1="300" x2="420" y2="410" class="stroke-subtle"/>
  
  <text x="450" y="335" class="text-title">ATTENTION INDEX</text>
  
  <text x="450" y="360" class="text-body">Hierarchy Balance</text>
  <rect x="450" y="368" width="220" height="5" rx="2.5" fill="var(--border-subtle, #3A3844)"/>
  <rect x="450" y="368" width="195" height="5" rx="2.5" fill="var(--accent, #9D84B7)"/>

  <text x="450" y="392" class="text-body">Visual Fatigue Mitigation</text>
  <rect x="450" y="400" width="220" height="5" rx="2.5" fill="var(--border-subtle, #3A3844)"/>
  <rect x="450" y="400" width="205" height="5" rx="2.5" fill="var(--accent, #9D84B7)"/>

  <!-- Bottom editorial signature -->
  <text x="100" y="445" class="text-body">PERCEPT ERGONOMIC SUITE // VISUAL SACCADE ANALYSIS</text>
  <text x="615" y="445" class="text-code">REV 2.2 [AUDITED]</text>
</svg>
