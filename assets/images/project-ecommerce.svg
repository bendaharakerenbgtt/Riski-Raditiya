  <circle cx="48" cy="21" r="5.5" fill="#ffbd2e" />
  <circle cx="68" cy="21" r="5.5" fill="#27c93f" />
  <rect x="180" y="12" width="240" height="18" rx="9" fill="#0e1017" />
  <text x="300" y="25" fill="#8892b0" font-family="sans-serif" font-size="10" text-anchor="middle">store.inliveiq.studio/checkout</text>

  <!-- Left Sidebar Navigation -->
