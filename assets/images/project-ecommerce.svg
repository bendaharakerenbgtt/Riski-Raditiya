  <text x="190" y="82" fill="#8892b0" font-family="sans-serif" font-size="10">Revenue</text>
  <text x="190" y="108" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">$48,290</text>

  <rect x="315" y="60" width="125" height="65" rx="6" fill="#1b1e2c" stroke="rgba(255,255,255,0.12)" />
  <text x="330" y="82" fill="#8892b0" font-family="sans-serif" font-size="10">Conversion</text>
  <text x="330" y="108" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">4.82%</text>

  <rect x="455" y="60" width="120" height="65" rx="6" fill="#1b1e2c" stroke="rgba(255,255,255,0.12)" />
  <text x="470" y="82" fill="#8892b0" font-family="sans-serif" font-size="10">Orders</text>
  <text x="470" y="108" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">1,420</text>

  <!-- Product Catalog Grid -->
  <rect x="175" y="140" width="190" height="215" rx="8" fill="#181b26" stroke="rgba(255,255,255,0.1)" />
  <rect x="190" y="155" width="160" height="110" rx="6" fill="#242838" />
  <!-- Minimalist Product Wireframe -->
  <circle cx="270" cy="210" r="30" fill="none" stroke="#ffffff" stroke-width="2" />
  <rect x="190" y="280" width="110" height="10" rx="3" fill="#ffffff" />
  <text x="190" y="312" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">$249.00</text>
  <rect x="290" y="295" width="60" height="25" rx="5" fill="#ffffff" />
  <text x="320" y="312" fill="#0d0f15" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Buy</text>

  <!-- Checkout Invoice Summary -->
  <rect x="380" y="140" width="195" height="215" rx="8" fill="#181b26" stroke="rgba(255,255,255,0.1)" />
