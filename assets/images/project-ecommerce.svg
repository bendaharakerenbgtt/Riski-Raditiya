      <stop offset="0%" stop-color="#151722" />
      <stop offset="100%" stop-color="#0c0e14" />
    </linearGradient>
  </defs>
  <rect width="600" height="380" rx="12" fill="url(#bgEcom)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  
  <!-- Window Header Bar -->
  <rect width="600" height="42" rx="12" fill="#1c1f2d" />
