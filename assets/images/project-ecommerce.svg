  <text x="395" y="285" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Total: $249.00</text>
  <rect x="395" y="300" width="165" height="32" rx="6" fill="#ffffff" />
  <text x="477" y="321" fill="#0d0f15" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Pay with Stripe</text>
