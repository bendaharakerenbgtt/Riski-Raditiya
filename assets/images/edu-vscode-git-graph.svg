<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 380" width="100%" height="100%" aria-hidden="true">
  <defs>
    <radialGradient id="gitAura" cx="50%" cy="50%" r="54%">
      <stop offset="0%" stop-color="#007acc" stop-opacity="0.3" />
      <stop offset="52%" stop-color="#4ec9b0" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1e1e1e" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="190" cy="190" r="175" fill="url(#gitAura)" />

  <!-- VS Code Source Control / Git Graph Window -->
  <rect x="26" y="26" width="328" height="328" rx="8" fill="#1e1e1e" stroke="#3c3c3c" stroke-width="1.6" />
  <!-- Panel Header -->
  <rect x="26" y="26" width="328" height="32" rx="8" fill="#252526" />
  <rect x="26" y="48" width="328" height="10" fill="#252526" />
  <text x="44" y="46" fill="#cccccc" font-family="ui-monospace, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="0.8">SOURCE CONTROL: GIT GRAPH</text>
  <circle cx="332" cy="42" r="4.5" fill="#4ec9b0" />

  <!-- Main Branch Rail (main) -->
  <line x1="88" y1="88" x2="88" y2="310" stroke="#007acc" stroke-width="3" stroke-linecap="round" />

  <!-- Feature Branch Rail (vocational/smk) -->
  <path d="M 88 286 C 128 286, 128 232, 128 206 L 128 196 C 128 168, 88 168, 88 148"
        fill="none" stroke="#ce9178" stroke-width="2.5" stroke-linecap="round" />

  <!-- Commit 3: NOW (Active HEAD) -->
  <g>
    <circle cx="88" cy="100" r="15" fill="#4ec9b0" fill-opacity="0.2">
      <animate attributeName="r" values="10;18;10" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="fill-opacity" values="0.35;0.05;0.35" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="88" cy="100" r="7" fill="#1e1e1e" stroke="#4ec9b0" stroke-width="2.5" />
    <circle cx="88" cy="100" r="3" fill="#4ec9b0" />

    <!-- Badge HEAD -> main -->
    <rect x="112" y="84" width="96" height="20" rx="4" fill="#007acc" />
    <text x="160" y="98" fill="#ffffff" font-family="ui-monospace, Consolas, monospace" font-size="9.5" font-weight="700" text-anchor="middle">HEAD -&gt; main</text>
    <rect x="214" y="84" width="46" height="20" rx="4" fill="#252526" stroke="#4ec9b0" stroke-width="1" />
    <text x="237" y="98" fill="#4ec9b0" font-family="ui-monospace, Consolas, monospace" font-size="9.5" font-weight="700" text-anchor="middle">NOW</text>

    <text x="112" y="122" fill="#d4d4d4" font-family="ui-monospace, Consolas, monospace" font-size="10.5">feat: Teknologi Rekayasa Multimedia</text>
  </g>

  <!-- Commit 2: 2024 (Merge Polimedia) -->
  <g>
    <circle cx="88" cy="176" r="6.5" fill="#1e1e1e" stroke="#569cd6" stroke-width="2.5" />
    <circle cx="88" cy="176" r="2.5" fill="#9cdcfe" />

    <rect x="112" y="164" width="52" height="20" rx="4" fill="#252526" stroke="#569cd6" stroke-width="1" />
    <text x="138" y="178" fill="#9cdcfe" font-family="ui-monospace, Consolas, monospace" font-size="9.5" font-weight="700" text-anchor="middle">2024</text>
    <text x="172" y="178" fill="#cccccc" font-family="ui-monospace, Consolas, monospace" font-size="10.5">Polimedia Jakarta (D-IV)</text>
  </g>

  <!-- Commit 1: 2021 (SMK Perintis 1 Depok) -->
  <g>
    <circle cx="128" cy="242" r="6.5" fill="#1e1e1e" stroke="#ce9178" stroke-width="2.5" />
    <circle cx="128" cy="242" r="2.5" fill="#ce9178" />

    <rect x="148" y="230" width="52" height="20" rx="4" fill="#252526" stroke="#ce9178" stroke-width="1" />
    <text x="174" y="244" fill="#ce9178" font-family="ui-monospace, Consolas, monospace" font-size="9.5" font-weight="700" text-anchor="middle">2021</text>
    <text x="208" y="244" fill="#cccccc" font-family="ui-monospace, Consolas, monospace" font-size="10.5">SMK Perintis 1 Depok</text>
    <text x="148" y="264" fill="#6a9955" font-family="ui-monospace, Consolas, monospace" font-size="9.5">// Bisnis Daring &amp; Pemasaran (Lulus)</text>
  </g>

  <!-- Initial Commit -->
  <g>
    <circle cx="88" cy="306" r="5.5" fill="#1e1e1e" stroke="#858585" stroke-width="2" />
    <text x="112" y="310" fill="#858585" font-family="ui-monospace, Consolas, monospace" font-size="10">init: academic foundation</text>
  </g>
</svg>
