<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" width="100%" height="100%" aria-hidden="true">
  <defs>
    <!-- Soft Ambient Radial Glow -->
    <radialGradient id="compassAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Core Hub Soft Light -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Dial Background -->
    <radialGradient id="dialBg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1a1f2c" />
      <stop offset="70%" stop-color="#10141e" />
      <stop offset="100%" stop-color="#090c12" />
    </radialGradient>

    <!-- Progress Arc Gradient -->
    <linearGradient id="progressArcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6c7488" stop-opacity="0.35" />
      <stop offset="55%" stop-color="#cfd6e6" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <!-- Needle Gradients -->
    <linearGradient id="needleNorth" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dce2ee" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="needleSouth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e3444" />
      <stop offset="100%" stop-color="#151923" />
    </linearGradient>
  </defs>

  <!-- Ambient White Glow Backdrop -->
  <circle cx="160" cy="190" r="158" fill="url(#compassAura)" />

  <!-- Outer Dashed Orbital Ring -->
  <circle cx="160" cy="190" r="136" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.2" stroke-dasharray="4 7" />

  <!-- Main Instrument Bezel -->
  <circle cx="160" cy="190" r="118" fill="url(#dialBg)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" />
  <circle cx="160" cy="190" r="102" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="1" />

  <!-- Precision Degree Tick Marks -->
  <g stroke="#ffffff" stroke-linecap="round">
    <!-- Cardinal Ticks (N, E, S, W) -->
    <line x1="160" y1="74" x2="160" y2="85" stroke-width="2" stroke-opacity="0.75" />
    <line x1="276" y1="190" x2="265" y2="190" stroke-width="2" stroke-opacity="0.45" />
    <line x1="160" y1="306" x2="160" y2="295" stroke-width="2" stroke-opacity="0.45" />
    <line x1="44" y1="190" x2="55" y2="190" stroke-width="2" stroke-opacity="0.45" />

    <!-- Intercardinal & Minor Ticks -->
    <line x1="242" y1="108" x2="235" y2="115" stroke-width="1.5" stroke-opacity="0.5" />
    <line x1="242" y1="272" x2="235" y2="265" stroke-width="1.5" stroke-opacity="0.3" />
    <line x1="78" y1="272" x2="85" y2="265" stroke-width="1.5" stroke-opacity="0.4" />
    <line x1="78" y1="108" x2="85" y2="115" stroke-width="1.5" stroke-opacity="0.5" />

    <!-- Fine 15-deg Ticks -->
    <line x1="190" y1="78" x2="188" y2="84" stroke-width="1" stroke-opacity="0.35" />
    <line x1="218" y1="89" x2="215" y2="95" stroke-width="1" stroke-opacity="0.35" />
    <line x1="261" y1="132" x2="255" y2="135" stroke-width="1" stroke-opacity="0.35" />
    <line x1="272" y1="160" x2="266" y2="162" stroke-width="1" stroke-opacity="0.35" />
    <line x1="130" y1="78" x2="132" y2="84" stroke-width="1" stroke-opacity="0.35" />
    <line x1="102" y1="89" x2="105" y2="95" stroke-width="1" stroke-opacity="0.35" />
    <line x1="59" y1="132" x2="65" y2="135" stroke-width="1" stroke-opacity="0.35" />
    <line x1="48" y1="160" x2="54" y2="162" stroke-width="1" stroke-opacity="0.35" />
    <line x1="48" y1="220" x2="54" y2="218" stroke-width="1" stroke-opacity="0.25" />
    <line x1="59" y1="248" x2="65" y2="245" stroke-width="1" stroke-opacity="0.25" />
  </g>

  <!-- Journey Progress Arc (2021 -> 2024 -> Active Now) -->
  <!-- Background Track Arc -->
  <circle cx="160" cy="190" r="118" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3" />
  <!-- Active Illuminated Arc from Bottom-Left (2021) sweeping clockwise past Top to Upper-Right (NOW) -->
  <path d="M 76.5 273.5 A 118 118 0 1 1 236 100"
        fill="none"
        stroke="url(#progressArcGrad)"
        stroke-width="3.2"
        stroke-linecap="round" />

  <!-- Milestone Nodes on the Journey Arc -->
  <!-- Node 1: 2021 (Start / SMK) -->
  <g>
    <circle cx="76.5" cy="273.5" r="5" fill="#141822" stroke="#9aa2b4" stroke-width="1.8" />
    <circle cx="76.5" cy="273.5" r="2" fill="#cfd6e6" />
  </g>

  <!-- Node 2: 2024 (Transition to Polimedia) -->
  <g>
    <circle cx="160" cy="72" r="5.5" fill="#141822" stroke="#ffffff" stroke-width="2" />
    <circle cx="160" cy="72" r="2.2" fill="#ffffff" />
  </g>

  <!-- Node 3: Active Current Position Indicator (Glowing Pulse Halo) -->
  <g>
    <circle cx="236" cy="100" r="14" fill="#ffffff" fill-opacity="0.12" />
    <circle cx="236" cy="100" r="9" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.2" />
    <circle cx="236" cy="100" r="4.5" fill="#ffffff" />
  </g>

  <!-- Subtle Inner Compass Rose Star -->
  <g opacity="0.22" stroke="#ffffff" stroke-width="1" fill="none">
    <polygon points="160,104 170,180 246,190 170,200 160,276 150,200 74,190 150,180" />
    <line x1="115" y1="145" x2="205" y2="235" />
    <line x1="205" y1="145" x2="115" y2="235" />
  </g>

  <!-- Inner Core Radial Glow -->
  <circle cx="160" cy="190" r="56" fill="url(#coreGlow)" />

  <!-- Directional Compass Needle (Pointing Upper-Right toward Active Indicator) -->
  <g transform="rotate(39 160 190)">
    <!-- North/Forward Luminous Tip -->
    <polygon points="160,94 171,190 149,190" fill="url(#needleNorth)" />
    <!-- Subtle Center Ridge on North Needle -->
    <polygon points="160,94 160,190 171,190" fill="#cfd6e4" opacity="0.45" />
    <!-- South/Trailing Dark Tip -->
    <polygon points="160,286 171,190 149,190" fill="url(#needleSouth)" stroke="rgba(255,255,255,0.28)" stroke-width="1" />
  </g>

  <!-- Center Hub with Minimalist Open Book Emblem -->
  <g>
    <circle cx="160" cy="190" r="24" fill="#0d111a" stroke="#ffffff" stroke-width="1.8" stroke-opacity="0.85" />
    <circle cx="160" cy="190" r="20" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1" />
    <!-- Minimalist Open Book Icon inside Hub -->
    <path d="M 160 185 C 155 182, 149 182, 146 184 L 146 196 C 149 194, 155 194, 160 197 C 165 194, 171 194, 174 196 L 174 184 C 171 182, 165 182, 160 185 Z"
          fill="none"
          stroke="#ffffff"
          stroke-width="1.6"
          stroke-linejoin="round" />
    <line x1="160" y1="185" x2="160" y2="197" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />
  </g>

  <!-- Minimal Monospace Journey Labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="600" letter-spacing="1.2" text-anchor="middle">
    <text x="52" y="294" fill="#8e96a8">2021</text>
    <text x="160" y="54" fill="#cfd6e6">2024</text>
    <text x="266" y="88" fill="#ffffff">NOW</text>
    <text x="160" y="346" fill="#6e7688" font-size="9" letter-spacing="2">ACADEMIC COMPASS</text>
  </g>
</svg>
