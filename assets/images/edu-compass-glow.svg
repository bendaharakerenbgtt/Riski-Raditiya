<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" aria-hidden="true">
  <defs>
    <!-- VS Code Blue + Teal Ambient Glow -->
    <radialGradient id="compassAuraOuter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#007acc" stop-opacity="0.34" />
      <stop offset="42%" stop-color="#4ec9b0" stop-opacity="0.14" />
      <stop offset="75%" stop-color="#007acc" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#1e1e1e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ec9b0" stop-opacity="0.65" />
      <stop offset="48%" stop-color="#007acc" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#1e1e1e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ec9b0" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#007acc" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#007acc" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="dialBg" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#2a2d32" />
      <stop offset="68%" stop-color="#222326" />
      <stop offset="100%" stop-color="#181818" />
    </radialGradient>

    <linearGradient id="progressArcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ce9178" />
      <stop offset="50%" stop-color="#007acc" />
      <stop offset="100%" stop-color="#4ec9b0" />
    </linearGradient>

    <linearGradient id="needleNorth" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9cdcfe" />
      <stop offset="100%" stop-color="#4ec9b0" />
    </linearGradient>
    <linearGradient id="needleSouth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3c3c3c" />
      <stop offset="100%" stop-color="#1e1e1e" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow Backdrop -->
  <circle cx="200" cy="200" r="196" fill="url(#compassAuraOuter)" />

  <!-- Subtle Extended Axis Crosshairs -->
  <g stroke="#569cd6" stroke-opacity="0.22" stroke-width="1">
    <line x1="200" y1="14" x2="200" y2="52" />
    <line x1="200" y1="348" x2="200" y2="386" />
    <line x1="14" y1="200" x2="52" y2="200" />
    <line x1="348" y1="200" x2="386" y2="200" />
  </g>

  <!-- Slowly Rotating Outer Telemetry Ring -->
  <g>
    <circle cx="200" cy="200" r="166" fill="none" stroke="#007acc" stroke-opacity="0.32" stroke-width="1.3" stroke-dasharray="4 8" />
    <circle cx="200" cy="200" r="154" fill="none" stroke="#4ec9b0" stroke-opacity="0.18" stroke-width="1" stroke-dasharray="18 12" />
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="90s" repeatCount="indefinite" />
  </g>

  <!-- Main Instrument Bezel -->
  <circle cx="200" cy="200" r="136" fill="url(#dialBg)" stroke="#3c3c3c" stroke-width="2" />
  <circle cx="200" cy="200" r="120" fill="none" stroke="#007acc" stroke-opacity="0.25" stroke-width="1" />
  <circle cx="200" cy="200" r="88" fill="none" stroke="#9cdcfe" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="2 6" />

  <!-- Precision Degree Tick Marks -->
  <g stroke="#9cdcfe" stroke-linecap="round">
    <line x1="200" y1="68" x2="200" y2="82" stroke-width="2.2" stroke-opacity="0.85" />
    <line x1="332" y1="200" x2="318" y2="200" stroke-width="2.2" stroke-opacity="0.5" />
    <line x1="200" y1="332" x2="200" y2="318" stroke-width="2.2" stroke-opacity="0.5" />
    <line x1="68" y1="200" x2="82" y2="200" stroke-width="2.2" stroke-opacity="0.5" />
    <line x1="293" y1="107" x2="284" y2="116" stroke-width="1.8" stroke-opacity="0.6" />
    <line x1="293" y1="293" x2="284" y2="284" stroke-width="1.8" stroke-opacity="0.35" />
    <line x1="107" y1="293" x2="116" y2="284" stroke-width="1.8" stroke-opacity="0.45" />
    <line x1="107" y1="107" x2="116" y2="116" stroke-width="1.8" stroke-opacity="0.55" />
  </g>

  <!-- Journey Progress Arc -->
  <circle cx="200" cy="200" r="136" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3.5" />
  <path d="M 103.8 296.2 A 136 136 0 1 1 288 96"
        fill="none" stroke="#007acc" stroke-opacity="0.22" stroke-width="12" stroke-linecap="round" />
  <path d="M 103.8 296.2 A 136 136 0 1 1 288 96"
        fill="none" stroke="url(#progressArcGrad)" stroke-width="3.6" stroke-linecap="round" />

  <!-- Milestone Nodes (Git Commit Style) -->
  <!-- 2021 -->
  <g>
    <circle cx="103.8" cy="296.2" r="9" fill="#ce9178" fill-opacity="0.18" />
    <circle cx="103.8" cy="296.2" r="5.5" fill="#1e1e1e" stroke="#ce9178" stroke-width="2.2" />
    <circle cx="103.8" cy="296.2" r="2.2" fill="#ce9178" />
  </g>
  <!-- 2024 -->
  <g>
    <circle cx="200" cy="64" r="11" fill="#007acc" fill-opacity="0.24" />
    <circle cx="200" cy="64" r="6" fill="#1e1e1e" stroke="#569cd6" stroke-width="2.2" />
    <circle cx="200" cy="64" r="2.5" fill="#9cdcfe" />
  </g>
  <!-- NOW Active Beacon -->
  <g>
    <circle cx="288" cy="96" r="22" fill="url(#beaconGlow)" />
    <circle cx="288" cy="96" r="11" fill="none" stroke="#4ec9b0" stroke-width="1.6" stroke-opacity="0.8">
      <animate attributeName="r" values="8;19;8" dur="2.6s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.85;0;0.85" dur="2.6s" repeatCount="indefinite" />
    </circle>
    <circle cx="288" cy="96" r="5.5" fill="#4ec9b0" />
  </g>

  <!-- Compass Rose Star -->
  <g stroke="#569cd6" fill="none">
    <polygon points="200,92 213,187 308,200 213,213 200,308 187,213 92,200 187,187" stroke-opacity="0.32" stroke-width="1.2" />
  </g>

  <!-- Inner Core Radial Glow -->
  <circle cx="200" cy="200" r="76" fill="url(#coreGlow)" />

  <!-- Directional Compass Needle -->
  <g transform="rotate(40 200 200)">
    <polygon points="200,82 216,200 184,200" fill="#4ec9b0" opacity="0.24" />
    <polygon points="200,88 212,200 188,200" fill="url(#needleNorth)" />
    <polygon points="200,88 200,200 212,200" fill="#ffffff" opacity="0.35" />
    <polygon points="200,312 212,200 188,200" fill="url(#needleSouth)" stroke="#569cd6" stroke-opacity="0.4" stroke-width="1.1" />
  </g>

  <!-- Center Hub with Open Book Emblem -->
  <g>
    <circle cx="200" cy="200" r="32" fill="#007acc" fill-opacity="0.2" />
    <circle cx="200" cy="200" r="27" fill="#1e1e1e" stroke="#4ec9b0" stroke-width="2" />
    <path d="M 200 194 C 194 190.5, 187 190.5, 183 193 L 183 207 C 187 204.5, 194 204.5, 200 208 C 206 204.5, 213 204.5, 217 207 L 217 193 C 213 190.5, 206 190.5, 200 194 Z"
          fill="none" stroke="#9cdcfe" stroke-width="1.8" stroke-linejoin="round" />
    <line x1="200" y1="194" x2="200" y2="208" stroke="#4ec9b0" stroke-width="1.6" stroke-linecap="round" />
  </g>

  <!-- Year Labels Kept -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="700" letter-spacing="1.2">
    <text x="82" y="320" fill="#ce9178" font-size="11.5" text-anchor="end">2021</text>
    <text x="200" y="42" fill="#9cdcfe" font-size="11.5" text-anchor="middle">2024</text>
    <text x="310" y="92" fill="#4ec9b0" font-size="11.5" text-anchor="start">NOW</text>
  </g>
</svg>
