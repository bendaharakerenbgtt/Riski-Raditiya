<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" aria-hidden="true">
  <defs>
    <!-- Deep Multi-Layer Ambient Glow -->
    <radialGradient id="compassAuraOuter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.24" />
      <stop offset="38%" stop-color="#dfe6f6" stop-opacity="0.10" />
      <stop offset="70%" stop-color="#b8c4dc" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Core Hub Luminous Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#e8eefc" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Active Beacon Glow -->
    <radialGradient id="beaconGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Dial Face Gradient -->
    <radialGradient id="dialBg" cx="50%" cy="42%" r="58%">
      <stop offset="0%" stop-color="#222938" />
      <stop offset="65%" stop-color="#111622" />
      <stop offset="100%" stop-color="#080b11" />
    </radialGradient>

    <!-- Progress Arc Gradient -->
    <linearGradient id="progressArcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c869e" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#d8e0f0" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
    </linearGradient>

    <!-- Needle Gradients -->
    <linearGradient id="needleNorth" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8e0ef" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <linearGradient id="needleSouth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e3547" />
      <stop offset="100%" stop-color="#141822" />
    </linearGradient>
  </defs>

  <!-- Rich Ambient White Glow Backdrop -->
  <circle cx="200" cy="200" r="196" fill="url(#compassAuraOuter)" />

  <!-- Subtle Extended Axis Crosshairs -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="1">
    <line x1="200" y1="14" x2="200" y2="52" />
    <line x1="200" y1="348" x2="200" y2="386" />
    <line x1="14" y1="200" x2="52" y2="200" />
    <line x1="348" y1="200" x2="386" y2="200" />
  </g>

  <!-- Slowly Rotating Outer Telemetry Ring -->
  <g>
    <circle cx="200" cy="200" r="166" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1.2" stroke-dasharray="3 9" />
    <circle cx="200" cy="200" r="154" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="18 12" />
    <animateTransform attributeName="transform" type="rotate" from="0 200 200" to="360 200 200" dur="90s" repeatCount="indefinite" />
  </g>

  <!-- Ambient Constellation / Light Motes around Orbit -->
  <g fill="#ffffff">
    <circle cx="66" cy="108" r="1.8" opacity="0.55" />
    <circle cx="334" cy="112" r="2.2" opacity="0.7" />
    <circle cx="348" cy="284" r="1.8" opacity="0.5" />
    <circle cx="72" cy="316" r="1.5" opacity="0.4" />
    <circle cx="298" cy="64" r="1.5" opacity="0.6" />
    <circle cx="108" cy="58" r="1.6" opacity="0.45" />
  </g>

  <!-- Main Instrument Bezel -->
  <circle cx="200" cy="200" r="136" fill="url(#dialBg)" stroke="rgba(255,255,255,0.28)" stroke-width="1.8" />
  <circle cx="200" cy="200" r="120" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
  <circle cx="200" cy="200" r="88" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1" stroke-dasharray="2 6" />

  <!-- Precision Degree Tick Marks -->
  <g stroke="#ffffff" stroke-linecap="round">
    <!-- Cardinal Ticks (N, E, S, W) -->
    <line x1="200" y1="68" x2="200" y2="82" stroke-width="2.2" stroke-opacity="0.85" />
    <line x1="332" y1="200" x2="318" y2="200" stroke-width="2.2" stroke-opacity="0.5" />
    <line x1="200" y1="332" x2="200" y2="318" stroke-width="2.2" stroke-opacity="0.5" />
    <line x1="68" y1="200" x2="82" y2="200" stroke-width="2.2" stroke-opacity="0.5" />

    <!-- Intercardinal Ticks -->
    <line x1="293" y1="107" x2="284" y2="116" stroke-width="1.8" stroke-opacity="0.6" />
    <line x1="293" y1="293" x2="284" y2="284" stroke-width="1.8" stroke-opacity="0.35" />
    <line x1="107" y1="293" x2="116" y2="284" stroke-width="1.8" stroke-opacity="0.45" />
    <line x1="107" y1="107" x2="116" y2="116" stroke-width="1.8" stroke-opacity="0.55" />

    <!-- Fine Degree Ticks -->
    <line x1="234" y1="73" x2="231" y2="80" stroke-width="1.1" stroke-opacity="0.45" />
    <line x1="266" y1="86" x2="262" y2="93" stroke-width="1.1" stroke-opacity="0.45" />
    <line x1="314" y1="134" x2="307" y2="138" stroke-width="1.1" stroke-opacity="0.45" />
    <line x1="327" y1="166" x2="320" y2="169" stroke-width="1.1" stroke-opacity="0.45" />
    <line x1="166" y1="73" x2="169" y2="80" stroke-width="1.1" stroke-opacity="0.45" />
    <line x1="134" y1="86" x2="138" y2="93" stroke-width="1.1" stroke-opacity="0.45" />
    <line x1="86" y1="134" x2="93" y2="138" stroke-width="1.1" stroke-opacity="0.45" />
    <line x1="73" y1="166" x2="80" y2="169" stroke-width="1.1" stroke-opacity="0.45" />
    <line x1="73" y1="234" x2="80" y2="231" stroke-width="1.1" stroke-opacity="0.3" />
    <line x1="86" y1="266" x2="93" y2="262" stroke-width="1.1" stroke-opacity="0.3" />
    <line x1="327" y1="234" x2="320" y2="231" stroke-width="1.1" stroke-opacity="0.3" />
    <line x1="314" y1="266" x2="307" y2="262" stroke-width="1.1" stroke-opacity="0.3" />
  </g>

  <!-- Journey Progress Arc (Layered Bloom Glow + Crisp Core Stroke) -->
  <!-- Background Track -->
  <circle cx="200" cy="200" r="136" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3.5" />
  <!-- Soft Outer Bloom Layer -->
  <path d="M 103.8 296.2 A 136 136 0 1 1 288 96"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.14"
        stroke-width="12"
        stroke-linecap="round" />
  <!-- Mid Bloom Layer -->
  <path d="M 103.8 296.2 A 136 136 0 1 1 288 96"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.32"
        stroke-width="6"
        stroke-linecap="round" />
  <!-- Crisp Illuminated Arc -->
  <path d="M 103.8 296.2 A 136 136 0 1 1 288 96"
        fill="none"
        stroke="url(#progressArcGrad)"
        stroke-width="3.2"
        stroke-linecap="round" />

  <!-- Milestone Nodes on the Journey Arc -->
  <!-- Node 1: 2021 (SMK) -->
  <g>
    <circle cx="103.8" cy="296.2" r="9" fill="#ffffff" fill-opacity="0.1" />
    <circle cx="103.8" cy="296.2" r="5.5" fill="#141822" stroke="#a6b0c4" stroke-width="2" />
    <circle cx="103.8" cy="296.2" r="2.2" fill="#e2e7f2" />
  </g>

  <!-- Node 2: 2024 (Polimedia) -->
  <g>
    <circle cx="200" cy="64" r="11" fill="#ffffff" fill-opacity="0.14" />
    <circle cx="200" cy="64" r="6" fill="#141822" stroke="#ffffff" stroke-width="2.2" />
    <circle cx="200" cy="64" r="2.5" fill="#ffffff" />
  </g>

  <!-- Node 3: Active Current Position Indicator (Glowing Pulse Beacon) -->
  <g>
    <circle cx="288" cy="96" r="22" fill="url(#beaconGlow)" />
    <circle cx="288" cy="96" r="11" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.65">
      <animate attributeName="r" values="8;18;8" dur="2.8s" repeatCount="indefinite" />
      <animate attributeName="stroke-opacity" values="0.75;0;0.75" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="288" cy="96" r="5.5" fill="#ffffff" />
  </g>

  <!-- Compass Rose Star Geometry -->
  <g stroke="#ffffff" fill="none">
    <polygon points="200,92 213,187 308,200 213,213 200,308 187,213 92,200 187,187" stroke-opacity="0.28" stroke-width="1.2" />
    <polygon points="142,142 200,185 258,142 215,200 258,258 200,215 142,258 185,200" stroke-opacity="0.14" stroke-width="1" />
  </g>

  <!-- Inner Core Radial Glow -->
  <circle cx="200" cy="200" r="76" fill="url(#coreGlow)" />

  <!-- Directional Compass Needle (Pointing Toward Active NOW Beacon) -->
  <g transform="rotate(40 200 200)">
    <!-- Soft Luminous Needle Glow -->
    <polygon points="200,82 216,200 184,200" fill="#ffffff" opacity="0.18" />
    <!-- North/Forward Luminous Tip -->
    <polygon points="200,88 212,200 188,200" fill="url(#needleNorth)" />
    <!-- Center Ridge Facet -->
    <polygon points="200,88 200,200 212,200" fill="#cfd6e6" opacity="0.5" />
    <!-- South/Trailing Dark Tip -->
    <polygon points="200,312 212,200 188,200" fill="url(#needleSouth)" stroke="rgba(255,255,255,0.32)" stroke-width="1.1" />
  </g>

  <!-- Center Hub with Luminous Ring & Open Book Emblem -->
  <g>
    <circle cx="200" cy="200" r="32" fill="#ffffff" fill-opacity="0.12" />
    <circle cx="200" cy="200" r="27" fill="#0d111a" stroke="#ffffff" stroke-width="2" stroke-opacity="0.92" />
    <circle cx="200" cy="200" r="22" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1" />
    <!-- Minimalist Open Book Icon inside Hub -->
    <path d="M 200 194 C 194 190.5, 187 190.5, 183 193 L 183 207 C 187 204.5, 194 204.5, 200 208 C 206 204.5, 213 204.5, 217 207 L 217 193 C 213 190.5, 206 190.5, 200 194 Z"
          fill="none"
          stroke="#ffffff"
          stroke-width="1.8"
          stroke-linejoin="round" />
    <line x1="200" y1="194" x2="200" y2="208" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Crisp Monospace Journey & Milestone Labels -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-weight="700" letter-spacing="1.2">
    <!-- 2021 SMK Badge -->
    <text x="82" y="320" fill="#9ea7ba" font-size="11" text-anchor="end">2021</text>
    <text x="82" y="333" fill="#687287" font-size="8.5" text-anchor="end">SMK</text>

    <!-- 2024 Polimedia Badge -->
    <text x="200" y="42" fill="#e2e8f6" font-size="11" text-anchor="middle">2024</text>

    <!-- NOW Active Badge -->
    <text x="310" y="88" fill="#ffffff" font-size="11.5" text-anchor="start">NOW</text>
    <text x="310" y="101" fill="#9aa4ba" font-size="8.5" text-anchor="start">ACTIVE</text>

    <!-- Bottom Caption -->
    <text x="200" y="376" fill="#7c8599" font-size="9.5" letter-spacing="2.4" text-anchor="middle">ACADEMIC JOURNEY</text>
  </g>
</svg>
