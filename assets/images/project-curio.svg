<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" fill="none">
  <defs>
    <style>
      .bg { fill: var(--card-canvas-bg, #27262D); }
      .stroke-subtle { stroke: var(--border-subtle, #3A3844); stroke-width: 1.5; }
      .stroke-accent { stroke: var(--accent, #9D84B7); stroke-width: 2; }
      .text-title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 13px; font-weight: 600; fill: var(--text-primary, #F0EFEB); letter-spacing: 0.08em; }
      .text-body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 11px; fill: var(--text-secondary, #9E9AA7); }
      .text-code { font-family: monospace; font-size: 10px; fill: var(--accent, #9D84B7); }
    </style>
  </defs>

  <rect width="800" height="500" rx="8" class="bg"/>

  <!-- System Dynamics Grid -->
  <line x1="100" y1="360" x2="700" y2="360" class="stroke-subtle"/>
  <line x1="140" y1="80" x2="140" y2="380" class="stroke-subtle"/>

  <text x="140" y="70" class="text-code">SYSTEM OUTCOME [Y]</text>
  <text x="630" y="380" class="text-code">TIME HORIZON [T]</text>

  <!-- First-order Thinking Curve (Immediate gain, long-term plateau/decay) -->
  <path d="M 140 360 C 180 200, 260 170, 420 180 T 680 210" stroke="var(--text-muted, #77727E)" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="430" y="165" class="text-body" fill="var(--text-muted, #77727E)">1st-Order Effect (Immediate Intuition)</text>

  <!-- Second-order Thinking Curve (Initial investment/dip, exponential systemic compounding) -->
  <path d="M 140 360 C 220 380, 320 350, 440 270 T 680 90" class="stroke-accent" stroke-width="2.5"/>
  <circle cx="680" cy="90" r="5" fill="var(--accent, #9D84B7)"/>
  <text x="520" y="80" class="text-title">2nd-Order Compounding</text>

  <!-- Feedback loops and nodes -->
  <!-- Node A -->
  <circle cx="280" cy="355" r="4" fill="var(--accent, #9D84B7)"/>
  <text x="250" y="385" class="text-code">INTERVENTION</text>

  <!-- Node B -->
  <circle cx="440" cy="270" r="4" fill="var(--accent, #9D84B7)"/>
  <text x="410" y="300" class="text-code">FEEDBACK LOOP</text>

  <!-- Node C -->
  <circle cx="560" cy="170" r="4" fill="var(--accent, #9D84B7)"/>
  <text x="530" y="200" class="text-code">EQUILIBRIUM SHIFT</text>

  <!-- Dynamic slider illustration -->
  <rect x="140" y="405" width="240" height="20" rx="10" fill="var(--border-subtle, #3A3844)"/>
  <rect x="140" y="405" width="140" height="20" rx="10" fill="var(--accent-soft, #3A3445)"/>
  <circle cx="280" cy="415" r="10" fill="var(--accent, #9D84B7)"/>
  <text x="140" y="445" class="text-code">PARAMETER: FEEDBACK GAIN (0.72)</text>

  <rect x="420" y="405" width="240" height="20" rx="10" fill="var(--border-subtle, #3A3844)"/>
  <rect x="420" y="405" width="180" height="20" rx="10" fill="var(--accent-soft, #3A3445)"/>
  <circle cx="600" cy="415" r="10" fill="var(--accent, #9D84B7)"/>
  <text x="420" y="445" class="text-code">PARAMETER: DELAY LATENCY (0.35)</text>
</svg>
